 const ex=new THREE.Group();const ec=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.02,0.16,6),basic(0xe02020));ec.position.y=0.52;const ed=new THREE.Mesh(sphG,basic(0xe02020));ed.scale.setScalar(0.035);ed.position.y=0.38;ex.add(ec,ed);ex.visible=false;g.add(ex);
 g.scale.setScalar(1.7);scene.add(g);bugs.push({g,lg,ex})}
// hero sunglasses
const treeGl=new THREE.Group();hero.add(treeGl);treeGl.visible=false;
{for(const s of[-1,1]){const l=new THREE.Mesh(sphG,basic(0x0b0b0b));l.scale.set(0.115,0.085,0.03);l.position.set(s*0.115,1.1,0.235);l.rotation.y=s*0.45;treeGl.add(l)}
 const b=new THREE.Mesh(boxG,basic(0x0b0b0b));b.scale.set(0.1,0.025,0.02);b.position.set(0,1.12,0.255);treeGl.add(b)}

// ---------- state helpers
const DAY={top:new THREE.Color(0x3d8ee0),bot:new THREE.Color(0xbfe3f5),hemiS:new THREE.Color(0xbcd8ff),hemiG:new THREE.Color(0xb08060),sun:new THREE.Color(0xfff1d0),hi:1.5,si:2.6};
const NIGHT={top:new THREE.Color(0x070d2c),bot:new THREE.Color(0x2b3d78),hemiS:new THREE.Color(0x5568a8),hemiG:new THREE.Color(0x3a3f66),sun:new THREE.Color(0x8aa4ff),hi:1.1,si:1.0};
function setTime(k){ // 0 day ... 1 night
 skyU.top.value.copy(DAY.top).lerp(NIGHT.top,k);skyU.bot.value.copy(DAY.bot).lerp(NIGHT.bot,k);
 scene.fog.color.copy(DAY.bot).lerp(NIGHT.bot,k);
 hemi.color.copy(DAY.hemiS).lerp(NIGHT.hemiS,k);hemi.groundColor.copy(DAY.hemiG).lerp(NIGHT.hemiG,k);hemi.intensity=DAY.hi+(NIGHT.hi-DAY.hi)*k;
 sunL.color.copy(DAY.sun).lerp(NIGHT.sun,k);sunL.intensity=DAY.si+(NIGHT.si-DAY.si)*k}
const BROWN=new THREE.Color(0x6b4429),HOT=new THREE.Color(0xe0562a),COLD=new THREE.Color(0x8fc4ee);
function camSet(p,l,fov=38,shake=0,t=0){cam.fov=fov;cam.updateProjectionMatrix();
 cam.position.copy(p);if(shake){cam.position.x+=Math.sin(t*61)*shake;cam.position.y+=Math.cos(t*47)*shake}cam.lookAt(l)}
const mixV=(a,b,k)=>a.clone().lerp(b,k);
function resetState(){
 sunM.visible=true;sunGl.visible=false;moon.visible=false;snow.visible=false;steam.visible=false;iceM.visible=false;
 crackSegs.forEach(m=>m.visible=false);flakes.forEach(f=>f.m.visible=false);rays.forEach(m=>m.visible=false);
 bugs.forEach(b=>b.g.visible=false);treeGl.visible=false;
 hero.userData.trunk.material.color.copy(BROWN);
 farmer.root.visible=true;farmer.glasses.visible=false;farmer.brush.visible=false;farmer.arms.forEach(a=>a.thumb.visible=false);
 farmer.setCrouch(0);farmer.upper.rotation.set(0,0,0);farmer.root.rotation.set(0,0,0);farmer.head.rotation.set(0,0,0);farmer.legs.forEach(l=>l.hip.rotation.set(0,0,0));
 bucket.visible=true;bucket.position.set(-0.8,0,0.9);hero.userData.paint.visible=false;setTime(0);
 sunM.position.set(-9,13,-14);sunM.scale.setScalar(1);sunL.position.set(-6,11,7);sunL.target.position.set(0,0,0);
 farmer.mopen.visible=false;farmer.mouth.visible=true}
function setPaint(p){const m=hero.userData.paint;m.scale.y=Math.max(1e-3,p);m.visible=p>0.02}
function talk(t,face=true){let sp=false;for(const s of SEG)if(t>=s.start&&t<=s.end)sp=true;
 const o=sp?(Math.abs(Math.sin(t*15))*0.8+0.2)*(0.6+0.4*Math.sin(t*5.3)):0;
 farmer.mopen.visible=sp&&o>0.35;farmer.mouth.visible=!farmer.mopen.visible;farmer.mopen.scale.set(0.055,0.025+0.05*o,0.02);
 const blink=(t%3.1)>3.0?0.15:1;farmer.lids.forEach(l=>l.scale.y=0.035*(blink>0.5?1:2.4));farmer.pups.forEach(p=>p.visible=blink>0.5)}

skyObjs.forEach(m=>{m.material.depthTest=false;m.material.depthWrite=false;m.renderOrder=-5});
const BOUND=[0,3.47,8.92,12.9,18.3,21.95,TOTAL+1];
const dummy=new THREE.Object3D();
function frame(t){
 resetState();
 let si=0;for(let i=0;i<6;i++)if(t>=BOUND[i])si=i;
 const t0=BOUND[si],dur=BOUND[si+1]-t0,u=t-t0,p=u/dur;
 talk(t);
 const F=farmer;
 if(si==0){ // ---- S1: granjero apoyado en el arbol blanco
  setPaint(0);
  F.root.position.set(-1.1,0,0.7);F.root.rotation.y=0.35;
  F.upper.rotation.z=0.05+Math.sin(t*1.6)*0.02;F.head.rotation.z=-0.08+Math.sin(t*1.1)*0.03;F.head.rotation.x=0.06;
  F.hips(F.arms[0],-1);F.hips(F.arms[1],1);
  bucket.position.set(-0.55,0,1.25);
  sunM.position.set(-9,12,-14);
  camSet(mixV(V(3.0,2.2,8.0),V(-0.3,1.3,4.7),E(p)),mixV(V(-0.8,1.7,0),V(-1.15,1.8,0.5),E(p)),38)
 }else if(si==1){ // ---- S2: dia / noche
  setPaint(0);F.root.visible=false;bucket.visible=false;
  const night=E((p-0.42)/0.16);setTime(night);
  const sy=12-night*6;
  sunM.position.set(-7-night*5,10-night*13,-16);sunM.visible=night<0.95;
  moon.visible=night>0.05;moon.position.set(-6,6+ (1-night)*-8,-16);
  sunL.position.set(-6,11,7);
  const hot=cl((1-night)*1.0),cold=night;
  const tr=hero.userData.trunk.material.color;tr.copy(BROWN);
  if(night<0.5){tr.lerp(HOT,E(p/0.4)*0.85*(0.8+0.2*Math.sin(t*9)))}else tr.lerp(COLD,cold*0.85);
  steam.visible=night<0.4&&p>0.08;
  for(let i=0;i<steamN;i++){const k=((t*0.55+i*0.37)%1.6)/1.6;dummy.position.set(Math.sin(i*5.1)*0.28,1.0+k*2.3,0.28+Math.cos(i*3.3)*0.1);dummy.scale.setScalar((0.07+k*0.14)*(1-k*0.5));dummy.rotation.set(0,0,0);dummy.updateMatrix();steam.setMatrixAt(i,dummy.matrix)}
  steam.instanceMatrix.needsUpdate=true;
  snow.visible=night>0.3;
  for(let i=0;i<snowN;i++){const s=snowP[i];const y=((s[1]-(t-t0)*s[3]*1.1)%8+8)%8;dummy.position.set(s[0]+Math.sin(t*1.2+s[4])*0.3,y,s[2]);dummy.scale.setScalar(s[5]);dummy.rotation.set(0,0,0);dummy.updateMatrix();snow.setMatrixAt(i,dummy.matrix)}
  snow.instanceMatrix.needsUpdate=true;
  iceM.visible=night>0.55;
  for(let i=0;i<iceN;i++){const q=iceP[i],a=q[0]*0.55,k=cl((night-0.55)*3-i*0.03);dummy.position.set(0.235*Math.sin(a),q[1],0.235*Math.cos(a));dummy.scale.set(q[2]*k,q[2]*1.6*k,q[2]*k);dummy.rotation.set(0.3,a,0.4);dummy.updateMatrix();iceM.setMatrixAt(i,dummy.matrix)}
  iceM.instanceMatrix.needsUpdate=true;
  camSet(mixV(V(2.2,1.5,6.4),V(1.2,1.7,4.8),E(p)),V(-0.1,2.1,0),44);cam.updateMatrixWorld(true);
  sunM.position.copy(cam.localToWorld(V(0.9,3.3-night*9,-12)));sunM.scale.setScalar(0.9);
  moon.position.copy(cam.localToWorld(V(-0.9,-6+night*9.6,-12)));moon.scale.setScalar(0.8);
 }else if(si==2){ // ---- S3: se agrieta
  setPaint(0);F.root.visible=false;bucket.visible=false;
  const cp=cl((u-0.5)/2.0);
  const alt=Math.floor(u/0.7)%2,ph=(u%0.7)/0.7,fl=Math.sin(Math.min(1,ph)*Math.PI);
  const tr=hero.userData.trunk.material.color;tr.copy(BROWN).lerp(alt?COLD:HOT,fl*0.9);
  setTime(alt?0.25:0);
  sunM.position.set(-9,10,-10);
  crackSegs.forEach((m,i)=>{m.visible=cp>(i+1)/16});
  const n=Math.floor(cp*16);
  for(const f of flakes){const tt=u-(0.5+f.t0*1.8)-0.4;f.m.visible=tt>0&&cp>0.35;if(tt>0){const y0=f.p[1];const g=Math.max(0.04,y0-4.9*tt*tt);f.m.position.set(f.p[0]+f.vx*tt*0.3,g,0.22+f.vz*tt*0.3);f.m.rotation.set(tt*f.r,tt*f.r*0.7,0)}}
  const shake=cp>0&&cp<1?0.02:0.004;
  camSet(mixV(V(1.2,1.5,2.7),V(0.6,1.4,2.2),E(p)),V(0,1.55-cp*0.05,0),36,shake,t)
 }else if(si==3){ // ---- S4: pintando
  const pp=cl((u-0.45)/(dur-1.8));const ph=1.5*E(pp);setPaint(ph);
  F.root.position.set(-1.25,0,-0.25);F.root.rotation.y=Math.PI/2-0.3;
  F.root.updateMatrixWorld(true);
  const crouch=cl(1.45-ph,0,0.85);F.setCrouch(crouch);
  F.brush.visible=true;F.hang(F.arms[1],1);F.arms[1].sh.rotation.z=0.5;F.arms[1].el.rotation.z=-1.4;
  F.head.rotation.set(0.05+0.1*Math.sin(u*2),-0.3,0);
  const by=Math.max(0.15,ph+0.12*Math.sin(u*11)-0.06+(pp>0?0.0:0.5));
  const target=V(-0.34,pp>0?by:1.2,0.12);
  const sh=F.arms[0].sh.getWorldPosition(V(0,0,0));
  const dir=sh.clone().sub(target);dir.y=0;dir.normalize();
  target.addScaledVector(dir,0.42);
  F.reach(F.arms[0],target);
  bucket.position.set(-0.95,0,0.55);
  F.legs.forEach(l=>l.hip.rotation.x=0);
  sunM.position.set(-9,11,-5);
  const hit=V(-0.2,0.9+ph*0.35,0.2);
  const k=cl((pp-0.3)*3)*(0.75+0.25*Math.sin(t*13));
  if(k>0){setRay(rays[0],sunM.position.clone().lerp(hit,0.35),hit,k);
   setRay(rays[1],hit,hit.clone().add(V(2.4,1.7,2.6)),k);setRay(rays[2],hit,hit.clone().add(V(2.8,0.6,1.6)),k*0.9);setRay(rays[3],hit,hit.clone().add(V(1.6,2.3,3.0)),k*0.8)}
  camSet(mixV(V(3.1,1.45,4.6),V(2.2,1.3,4.0),E(p)),V(-0.5,1.05,0.1),40)
 }else if(si==4){ // ---- S5: bichos
  setPaint(1.5);F.root.visible=false;bucket.visible=false;
  treeGl.visible=false;
  bugs.forEach((b,i)=>{
   const tb=u-0.1-i*0.2;const a=Math.PI/2+(i-2.5)*0.2;
   let r,fleeing=false,pause=false;
   if(tb<1.4){r=3.4-(3.4-0.68)*Math.max(0,tb)/1.4}else if(tb<1.95){r=0.68;pause=true}else{r=0.68+(tb-1.95)*5;fleeing=true}
   b.g.visible=tb>=0&&r<6.5;
   const dx=Math.cos(a),dz=Math.sin(a);
   b.g.position.set(dx*r,Math.abs(Math.sin(tb*20))*0.02+(pause?Math.max(0,Math.sin((tb-1.4)/0.55*Math.PI*2))*0.22:0),dz*r);
   let th=Math.atan2(-dx,-dz);if(fleeing)th+=Math.PI;b.g.rotation.y=th+(pause?Math.sin(tb*50)*0.15:0);
   b.ex.visible=pause;b.g.scale.setScalar(1.15);b.lg.forEach((l,k)=>l.rotation.x=Math.sin(tb*34+k)*0.5)});
  camSet(mixV(V(0.9,1.35,5.6),V(0.5,1.0,4.7),E(p)),V(0,0.55,0.5),44)
 }else{ // ---- S6: protector solar
  setPaint(1.5);treeGl.visible=u>0.5;
  F.root.position.set(-0.95,0,0.85);F.root.rotation.y=0.4;F.glasses.visible=u>0.3;
  F.upper.rotation.z=Math.sin(t*2)*0.02;F.head.rotation.z=0.06;
  F.hips(F.arms[1],1);
  const th=F.arms[0];th.thumb.visible=true;
  F.reach(th,F.root.localToWorld(V(-0.4,1.95+0.06*Math.sin(t*6),0.5)));
  bucket.position.set(-0.55,0,1.6);
  sunGl.visible=u>1.0;
  camSet(mixV(V(2.0,1.5,7.2),V(1.0,1.55,5.8),E(p)),V(-0.5,1.7,0),40);cam.updateMatrixWorld(true);
  sunM.position.copy(cam.localToWorld(V(1.1,3.6,-14)));sunM.scale.setScalar(0.95)}
 sunL.target.position.set(0,0,0);
 clouds.forEach((c,i)=>c.position.x=-45+i*15+t*0.4);
 sky.position.copy(cam.position);
 renderer.render(scene,cam);
 // subtitles
 const sub=document.getElementById('sub');let txt='',sc=1;
 for(const s of SEG){const words=s.text.split(/\s+/);const gs=[];let cur=[];
  for(const w of words){cur.push(w);if(cur.length>=2||/[.,?!:;]$/.test(w)){gs.push(cur.join(' '));cur=[]}}if(cur.length)gs.push(cur.join(' '));
  const tot=gs.reduce((a,g)=>a+g.length+2,0);let a0=s.start;
  gs.forEach((g,gi)=>{const d=(g.length+2)/tot*s.dur;const e=gi==gs.length-1?s.end+0.15:a0+d;if(t>=a0&&t<e){txt=g;sc=1+0.14*Math.max(0,1-(t-a0)/0.12)}a0+=d})}
 sub.textContent=txt;sub.style.transform=`scale(${sc})`;sub.style.visibility=txt?'visible':'hidden';
 let fl=0;for(const b of BOUND.slice(1,6))if(t>=b&&t<b+0.14)fl=0.85*(1-(t-b)/0.14);
 document.getElementById('flash').style.opacity=fl;
}
window.renderFrame=frame;window.TOTAL=TOTAL;window.ready=true;
</script></body></html>
