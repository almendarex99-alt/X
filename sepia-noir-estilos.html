<title>10 Estilos Sepia Noir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&family=Special+Elite&display=swap">
<style>
/* Layout: encabezado + cuadrícula de 10 fotogramas 16:9 (formato YouTube), cada uno con título y la idea de video. */
:root{--bg:#171108;--card:#241b0f;--fg:#f1e4c8;--mute:#b8a47f;--acc:#e0a24a;--line:#4a3a22;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 'Inter',system-ui,sans-serif;
 padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
h1{font:400 clamp(34px,7vw,64px)/1 'Anton',Impact,sans-serif;text-transform:uppercase;margin:0 0 10px;text-wrap:balance}
h1 em{font-style:normal;color:var(--acc)}
.lead{color:var(--mute);max-width:62ch;margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.info{padding:12px 16px 16px;display:flex;flex-direction:column;gap:4px}
.n{font:600 12px 'Inter',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.t{font:400 25px/1.1 'Anton',Impact,sans-serif;text-transform:uppercase}
.d{font-size:14px;color:var(--mute)}.d b{color:var(--fg)}
</style>

<div class="wrap">
  <h1>10 estilos <em>sepia noir</em> para tus videos</h1>
  <p class="lead">Cine antiguo con sombras de detective y un humor muy tonto. Cada fotograma es 16:9, listo para pensar en miniatura o en escena de YouTube.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const INK='#2a1c0e',PAP='#dcc7a1',PAP2='#e9d9b8',DK='#16100a',RED='#8c2f1b';
const SERIF="'Special Elite','Courier New',monospace";
let uid=0;
/* base: papel sepia + grano + viñeta + rayones de película */
const base=(inner,o={})=>{const i=++uid;
 return `<svg viewBox="0 0 320 180" role="img" xmlns="http://www.w3.org/2000/svg"><defs>
 <filter id="gr${i}"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="${i}"/><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .13  0 0 0 0 .05  0 0 0 .55 0"/></filter>
 <radialGradient id="vg${i}" cx=".5" cy=".5" r=".75"><stop offset=".5" stop-color="#3a2410" stop-opacity="0"/><stop offset="1" stop-color="#2a1604" stop-opacity=".75"/></radialGradient></defs>
 <rect width="320" height="180" fill="${o.bg||PAP}"/>${inner}
 <rect width="320" height="180" filter="url(#gr${i})" opacity=".5"/>
 <g stroke="#fff" stroke-opacity=".22" stroke-width=".6"><path d="M${60+i*13%80} 0v180M${210-i*7%60} 0v180"/></g>
 <rect width="320" height="180" fill="url(#vg${i})"/></svg>`};
/* stickman: x,y esquina, s escala; hat, coat, opciones de brazos */
const man=(x,y,s,o={})=>{const c=o.c||INK;
 return `<g transform="translate(${x} ${y}) scale(${s})" stroke="${c}" stroke-width="${o.w||3.4}" stroke-linecap="round" stroke-linejoin="round" fill="none">
 ${o.coat?`<path d="M50 32l-14 40 28 0z" fill="${o.coat}" stroke="none"/>`:''}
 <path d="${o.body||'M50 30v32'}"/><path d="${o.arms||'M50 38L34 54M50 38l16 14'}"/><path d="${o.legs||'M50 62L38 96M50 62l12 34'}"/>
 <circle cx="50" cy="21" r="9" fill="${o.head||PAP2}"/>
 ${o.eyes===false?'':`<circle cx="46.5" cy="20" r="1.2" fill="${c}" stroke="none"/><circle cx="53.5" cy="20" r="1.2" fill="${c}" stroke="none"/>`}
 ${o.mouth||'<path d="M46.5 25q3.5 2.5 7 0"/>'}
 ${o.hat?`<ellipse cx="50" cy="13.5" rx="14" ry="3" fill="${c}" stroke="none"/><path d="M41 14q9-14 18 0z" fill="${c}" stroke="none"/>`:''}
 ${o.extra||''}</g>`};
const plate=(t,o={})=>`<rect x="${o.x||20}" y="${o.y||144}" width="${o.w||280}" height="26" fill="${DK}" opacity=".88"/><text x="${(o.x||20)+(o.w||280)/2}" y="${(o.y||144)+17.5}" text-anchor="middle" font-family="${SERIF}" font-size="${o.fs||13}" fill="${PAP2}">${t}</text>`;

const S=[
{n:'El detective',d:'Persianas, sombrero y una pista diminuta.',u:'"El caso del calcetín perdido": misterios cotidianos',
 s:()=>base(`<g fill="#f4e7c6" opacity=".6">${[0,1,2,3,4,5].map(k=>`<polygon points="${60+k*36},0 ${80+k*36},0 ${180+k*36},140 ${160+k*36},140"/>`).join('')}</g><rect y="132" width="320" height="48" fill="#b89d73"/>`+
 man(120,40,1.15,{hat:1,coat:INK,eyes:false,arms:'M50 38L30 56M50 38l22 4',extra:`<circle cx="76" cy="48" r="10" fill="#f4e7c6" fill-opacity=".5"/><path d="M83 55l8 9" stroke-width="4"/>`})+
 `<path d="M240 140q8-8 16 0v10h-16z" fill="${RED}" stroke="${INK}" stroke-width="2"/><path d="M236 124l6 8" stroke="${INK}" stroke-width="2"/>`+plate('EL CASO DEL CALCETÍN PERDIDO'))},
{n:'Cine mudo',d:'Intertítulos, rayones y dramatismo exagerado.',u:'Reacciones dramáticas a problemas mínimos',
 s:()=>base(`<rect x="22" y="14" width="276" height="152" fill="#cdb78c" stroke="${INK}" stroke-width="3"/>`+
 [...Array(14)].map((_,k)=>`<rect x="${30+k*19.5}" y="4" width="8" height="6" fill="${DK}"/><rect x="${30+k*19.5}" y="170" width="8" height="6" fill="${DK}"/>`).join('')+
 `<rect x="64" y="26" width="192" height="46" fill="${DK}"/><rect x="68" y="30" width="184" height="38" fill="none" stroke="${PAP2}" stroke-width="1"/><text x="160" y="54" text-anchor="middle" font-family="${SERIF}" font-size="17" fill="${PAP2}">¡Se acabó el café!</text>`+
 man(130,72,.9,{arms:'M50 38L28 18M50 38L72 18',mouth:'<ellipse cx="50" cy="26" rx="3" ry="3.5" fill="#2a1c0e"/>',head:PAP2})+
 `<path d="M104 78q-4 6 0 10M214 78q4 6 0 10" stroke="${INK}" stroke-width="2.4" fill="none"/>`)},
{n:'Persecución',d:'Una tarta gigante persigue al héroe, como el cine de payasos.',u:'Escenas de acción absurda, sketches',
 s:()=>base(`<rect y="140" width="320" height="40" fill="#b89d73"/><g stroke="${INK}" stroke-width="2.5" opacity=".6"><path d="M16 80h40M8 100h36M20 120h30"/></g>`+
 man(168,52,.95,{hat:1,arms:'M50 38L28 28M50 38l24 20',legs:'M50 62L30 80L22 96M50 62l24 14l14 16',body:'M50 30l6 32'})+
 `<g transform="translate(236 66)"><ellipse cx="38" cy="56" rx="40" ry="10" fill="#b0905f"/><path d="M0 40q0-34 38-34t38 34z" fill="#f4e7c6" stroke="${INK}" stroke-width="3"/><path d="M6 40q10 10 20 0t20 0t20 0t16-2" fill="#f4e7c6" stroke="${INK}" stroke-width="3"/><circle cx="26" cy="32" r="3" fill="${INK}"/><circle cx="46" cy="32" r="3" fill="${INK}"/><path d="M20 24l12 5M52 24l-12 5" stroke="${INK}" stroke-width="3"/><circle cx="38" cy="2" r="6" fill="${RED}"/></g>`+plate('PERSEGUIDO POR UNA TARTA'))},
{n:'Portada EXTRA',d:'Periódico de 1940 con titulares ridículos.',u:'Noticias falsas graciosas, resúmenes humorísticos',
 s:()=>base(`<rect x="14" y="8" width="292" height="164" fill="#efe1bf" stroke="${INK}" stroke-width="2.5"/><text x="160" y="36" text-anchor="middle" font-family="Anton,serif" font-size="25" fill="${INK}" letter-spacing="1.5">EL DIARIO NOIR</text><path d="M24 42h272M24 45h272" stroke="${INK}" stroke-width="1.2"/><text x="160" y="66" text-anchor="middle" font-family="Anton,serif" font-size="12.5" fill="${RED}">¡EXTRA! HOMBRE PIERDE LA PACIENCIA CON EL WIFI</text>`+
 `<rect x="24" y="76" width="112" height="86" fill="#c9b184" stroke="${INK}" stroke-width="2"/>`+man(52,70,.74,{arms:'M50 38L30 24M50 38l20-14',mouth:'<path d="M45 27q5-4 10 0"/>'})+
 [0,1,2,3,4,5,6].map(k=>`<rect x="148" y="${78+k*12}" width="${k==6?60:148}" height="4" fill="${INK}" opacity=".6"/>`).join(''))},
{n:'Jazz de medianoche',d:'Foco de luz, humo y un saxofón torcido.',u:'Música, relajación, historias nocturnas',
 s:()=>base(`<rect width="320" height="180" fill="${DK}"/><polygon points="160,0 80,180 240,180" fill="#e9d9b8" opacity=".2"/><ellipse cx="160" cy="170" rx="80" ry="8" fill="#e9d9b8" opacity=".25"/>`+
 man(112,56,1,{c:'#e9d9b8',head:DK,eyes:false,arms:'M50 38L64 56M50 38l-6 16',extra:`<path d="M60 40l6 4v36" stroke-width="5" stroke="#e0a24a"/><path d="M66 80q0 14 12 6l4-10" stroke-width="6" stroke="#e0a24a"/>`,hat:1})+
 `<g fill="none" stroke="#e9d9b8" stroke-width="2" opacity=".6"><path d="M232 100q-14-12 0-24t0-24"/><path d="M252 110q-14-12 0-24t0-24"/></g><g fill="#e9d9b8" opacity=".85" font-family="serif" font-size="22"><text x="206" y="70">♪</text><text x="232" y="48">♫</text><text x="196" y="40">♪</text></g>`+plate('JAZZ PARA LUNES',{}).replace(DK,'#000'))},
{n:'Oficina 1950',d:'Máquina de escribir, lámpara y papeles que nadie lee.',u:'Humor de trabajo, productividad, estudiantes',
 s:()=>base(`<rect x="214" y="22" width="64" height="64" rx="32" fill="#efe1bf" stroke="${INK}" stroke-width="3"/><path d="M246 54V34M246 54l16 8" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><rect y="132" width="320" height="48" fill="#a2845a"/><rect x="20" y="112" width="190" height="14" fill="#7b5a34" stroke="${INK}" stroke-width="2"/>`+
 man(70,24,.88,{arms:'M50 38L34 58L58 70M50 38l12 22l-4 10',legs:'M50 62h30v30M50 62h22v34',body:'M50 30v32',eyes:true})+
 `<rect x="96" y="90" width="42" height="22" fill="${INK}"/><rect x="100" y="84" width="34" height="8" fill="#efe1bf" stroke="${INK}" stroke-width="1.5"/>`+
 `<g stroke="${INK}" stroke-width="2" fill="#efe1bf"><rect x="160" y="82" width="34" height="30"/><rect x="164" y="74" width="34" height="30"/><rect x="168" y="66" width="30" height="30"/></g>`+plate('REPORTE URGENTE: NADIE LEE LOS REPORTES',{fs:11.5}))},
{n:'Se busca',d:'Cartel del viejo oeste con un crimen muy serio.',u:'Retos, desafíos y confesiones divertidas',
 s:()=>base(`<rect x="70" y="8" width="180" height="164" fill="#efe1bf" stroke="${INK}" stroke-width="3"/><rect x="76" y="14" width="168" height="152" fill="none" stroke="${INK}" stroke-width="1.2"/><text x="160" y="42" text-anchor="middle" font-family="Anton,serif" font-size="27" fill="${INK}" letter-spacing="3">SE BUSCA</text><rect x="116" y="50" width="88" height="62" fill="#c9b184" stroke="${INK}" stroke-width="2"/>`+
 man(130,42,.58,{hat:1,eyes:true,arms:'M50 38L30 54M50 38l20 16'})+
 `<text x="160" y="126" text-anchor="middle" font-family="${SERIF}" font-size="8.6" fill="${INK}">por robar el último trozo de pizza</text><text x="160" y="150" text-anchor="middle" font-family="Anton,serif" font-size="11.5" fill="${RED}">RECOMPENSA: 5 PESOS Y UNA SODA</text><circle cx="86" cy="24" r="2.5" fill="${INK}"/><circle cx="234" cy="24" r="2.5" fill="${INK}"/>`)},
{n:'Noche de lluvia',d:'Farol, charco y un paraguas heroico.',u:'Historias, poesía, reflexiones graciosas',
 s:()=>base(`<rect width="320" height="180" fill="#4a3822"/><polygon points="76,26 20,150 132,150" fill="#f1dfae" opacity=".3"/><rect x="72" y="26" width="6" height="124" fill="${DK}"/><rect x="64" y="20" width="22" height="9" rx="3" fill="${DK}"/><ellipse cx="190" cy="156" rx="64" ry="9" fill="#2e2214"/><ellipse cx="190" cy="156" rx="34" ry="4" fill="#e9d9b8" opacity=".25"/>`+
 [...Array(26)].map((_,k)=>`<path d="M${(k*47)%320} ${(k*31)%140}l-6 16" stroke="#e9d9b8" stroke-width="1.2" opacity=".5"/>`).join('')+
 man(150,40,1,{c:'#e9d9b8',head:'#4a3822',coat:'#e9d9b8',extra:`<path d="M24 20q26-26 52 0z" fill="${RED}" stroke="${INK}" transform="translate(26 -2)"/><path d="M76 8v22" stroke="#e9d9b8"/>`})+
 plate('LLOVÍA. MIS CALCETINES OPINABAN LO MISMO.',{fs:11}).replace(DK,'#000'))},
{n:'Interrogatorio',d:'Foco colgante, mesa y respuestas poco útiles.',u:'Sketches de comedia, preguntas y respuestas',
 s:()=>base(`<rect width="320" height="180" fill="#2a1f12"/><path d="M160 0v34" stroke="#dcc7a1" stroke-width="2"/><path d="M142 44l8-12h20l8 12z" fill="#dcc7a1"/><polygon points="152,44 168,44 230,150 90,150" fill="#f1dfae" opacity=".18"/><rect x="60" y="120" width="200" height="10" fill="#7b5a34" stroke="#000" stroke-width="2"/><rect x="72" y="130" width="8" height="40" fill="#7b5a34"/><rect x="240" y="130" width="8" height="40" fill="#7b5a34"/>`+
 man(40,56,.88,{c:'#e9d9b8',head:'#2a1f12',hat:1,coat:'#e9d9b8'})+man(218,56,.88,{c:'#e9d9b8',head:'#2a1f12',mouth:'<path d="M46 26h8"/>'})+
 `<rect x="12" y="14" width="132" height="32" rx="8" fill="#efe1bf" stroke="#000" stroke-width="2"/><text x="78" y="34" text-anchor="middle" font-family="${SERIF}" font-size="10.5" fill="${INK}">¿Dónde estabas anoche?</text><rect x="212" y="14" width="68" height="32" rx="8" fill="#efe1bf" stroke="#000" stroke-width="2"/><text x="246" y="34" text-anchor="middle" font-family="${SERIF}" font-size="12" fill="${INK}">Dormido.</text>`)},
{n:'Radioteatro',d:'Micrófono antiguo, luz de "en el aire" y ondas de sonido.',u:'Podcasts, narraciones, historias de terror cómico',
 s:()=>base(`<rect width="320" height="180" fill="#3b2a18"/><g fill="none" stroke="#e0a24a" stroke-width="3" opacity=".7"><path d="M176 74q20 16 0 32"/><path d="M190 64q30 26 0 52"/><path d="M204 54q40 36 0 72"/></g><rect x="230" y="22" width="64" height="26" rx="4" fill="${RED}" stroke="#000" stroke-width="2"/><text x="262" y="40" text-anchor="middle" font-family="Anton,sans-serif" font-size="14" fill="#f1dfae" letter-spacing="1.5">EN EL AIRE</text>`+
 `<rect x="150" y="104" width="6" height="40" fill="#1d1309"/><rect x="132" y="142" width="42" height="7" rx="3" fill="#1d1309"/><rect x="138" y="70" width="30" height="40" rx="12" fill="#e9d9b8" stroke="#000" stroke-width="3"/><path d="M142 82h22M142 90h22M142 98h22" stroke="#000" stroke-width="2"/>`+
 man(40,44,.95,{c:'#e9d9b8',head:'#3b2a18',arms:'M50 38L74 50M50 38l-14 18',mouth:'<ellipse cx="50" cy="26" rx="2.6" ry="3" fill="#e9d9b8"/>'})+
 plate('RADIO MISTERIO · CAPÍTULO 7',{}).replace(DK,'#000'))}
];
const grid=document.getElementById('grid');
S.forEach((s,i)=>{const c=document.createElement('article');c.className='card';
 c.innerHTML=s.s()+`<div class="info"><div class="n">Estilo ${i+1}</div><div class="t">${s.n}</div><div class="d">${s.d}</div><div class="d"><b>Idea de video:</b> ${s.u}</div></div>`;grid.appendChild(c)});
</script>
